[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctp-wrapper"
version = "0.1.0"
description = "CTP API SWIG wrapper for Linux"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools]
packages = ["ctp", "ctp.api"]

[tool.setuptools.package-data]
ctp = ["api/_*.so"]
